name: OpenSpec

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate specs
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: 1.14 escalates the >500-char requirement note from INFO to
      # WARNING, which --strict fails on in-app-feedback's signing requirement.
      - run: npx -y @fission-ai/openspec@1.13.2 validate --specs --strict
