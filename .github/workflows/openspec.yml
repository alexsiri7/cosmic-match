name: OpenSpec

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate specs
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # OpenSpec is pinned (with integrity hashes) by .github/openspec/package-lock.json
      # and kept on the latest release by Dependabot (#318). If a Dependabot bump fails
      # --strict, fix the specs in that PR; do not hold the pin back (#270).
      - run: npm ci --ignore-scripts
        working-directory: .github/openspec

      - run: .github/openspec/node_modules/.bin/openspec validate --specs --strict
