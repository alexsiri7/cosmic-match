name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  # Dispatched daily by the factory build-drift check. Every publish/notify
  # step in the release job is gated on `github.event_name == 'push'`, so a
  # dispatched run builds but never deploys.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          cache: true

      - run: flutter analyze

  test:
    name: Test
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          cache: true

      - run: flutter test --exclude-tags screenshots

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          cache: true

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: flutter pub get

      - name: Resolve version
        env:
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BUILD_NAME="${GITHUB_REF#refs/tags/v}"
          else
            BUILD_NAME="$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')"
          fi
          # github.run_number is monotonically increasing per workflow per repo and
          # is unaffected by history rewrites. The +1000 offset vaults past version
          # codes (incl. 1, 64, 66) already consumed in Play Console under the prior
          # `git rev-list --count HEAD` scheme. See issue #134.
          # NOTE: run_number is scoped to this workflow file's path — renaming or
          # moving ci.yml will reset the counter and break Play Store monotonicity.
          BUILD_NUMBER=$((GH_RUN_NUMBER + 1000))
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      # Resolve signing keystore. push / workflow_dispatch runs use the real
      # release keystore from secrets; pull_request runs always use a CI
      # throwaway so PR-controlled build code never sees release secrets
      # (SEC-01). The release build path is still exercised on every PR.
      - name: Resolve signing keystore
        id: keystore
        env:
          KEYSTORE_B64:   ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64 || '' }}
          STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_STORE_PASSWORD || '' }}
          KEY_PASSWORD:   ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_KEY_PASSWORD || '' }}
          KEY_ALIAS:      ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_KEY_ALIAS || '' }}
        run: |
          set -u
          KS=android/cosmic-match-release.jks
          USED_REAL=no
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode --ignore-garbage > "$KS" 2>/dev/null || true
            if keytool -list -storetype PKCS12 -storepass "${STORE_PASSWORD:-}" -keystore "$KS" >/dev/null 2>&1 \
               || keytool -list -storetype JKS    -storepass "${STORE_PASSWORD:-}" -keystore "$KS" >/dev/null 2>&1; then
              echo "::notice ::Using real release keystore from KEYSTORE_BASE64"
              USED_REAL=yes
            else
              echo "::warning ::KEYSTORE_BASE64 is set but the decoded file is not a readable keystore. Falling back to CI throwaway. The produced AAB will NOT be uploadable to Play Store."
              rm -f "$KS"
            fi
          else
            echo "::notice ::No release keystore for this event (pull_request, or secret missing) — generating CI throwaway keystore"
          fi

          if [ "$USED_REAL" = "no" ]; then
            keytool -genkey -v \
              -keystore "$KS" \
              -alias cosmic-match \
              -keyalg RSA -keysize 2048 \
              -validity 1 \
              -storepass ci_build -keypass ci_build \
              -dname "CN=CI Build" \
              -storetype PKCS12
            STORE_PASSWORD=ci_build
            KEY_PASSWORD=ci_build
            KEY_ALIAS=cosmic-match
          fi

          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=${{ github.workspace }}/$KS"
          } > android/key.properties
          echo "used_real=$USED_REAL" >> "$GITHUB_OUTPUT"

      - name: Assert no GitHub tokens in build environment
        run: |
          if env | grep -q '^GITHUB_FEEDBACK_TOKEN='; then
            echo "ERROR: GITHUB_FEEDBACK_TOKEN must not be set — embedding PATs in binaries is forbidden." >&2
            exit 1
          fi

      - name: Build release AAB
        env:
          SENTRY_DSN:           ${{ github.event_name != 'pull_request' && secrets.SENTRY_DSN || '' }}
          FEEDBACK_WORKER_URL:  ${{ vars.FEEDBACK_WORKER_URL || 'https://feedback.alexsiri7.workers.dev/' }}
          FEEDBACK_HMAC_SECRET: ${{ github.event_name != 'pull_request' && secrets.FEEDBACK_HMAC_SECRET || '' }}
          # Read by the Sentry Android Gradle Plugin (android/app/build.gradle.kts);
          # org/project are configured in the gradle `sentry { }` block, which the
          # plugin prefers over env vars, so they are not duplicated here.
          # Empty token (pull_request runs, where release secrets are withheld)
          # disables the upload but the build still succeeds. When the token IS
          # set, the plugin uploads mapping.txt as part of the Gradle build graph —
          # Sentry API availability is therefore a hard release-build dependency on
          # main and tag pushes (a Sentry outage blocks the AAB build).
          SENTRY_AUTH_TOKEN:    ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
        # --split-debug-info + --obfuscate produce the Dart debug symbols that
        # sentry_dart_plugin uploads in the next step, enabling server-side
        # symbolication of release stack traces.
        run: flutter build appbundle --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --split-debug-info=build/symbols --obfuscate --dart-define=SENTRY_DSN=$SENTRY_DSN --dart-define=FEEDBACK_WORKER_URL=$FEEDBACK_WORKER_URL --dart-define=FEEDBACK_HMAC_SECRET=$FEEDBACK_HMAC_SECRET

      - name: Upload debug symbols to Sentry (AAB)
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
        # Gate on SENTRY_AUTH_TOKEN so pull_request runs (no release secrets)
        # don't fail this step.
        if: env.SENTRY_AUTH_TOKEN != ''
        run: flutter pub run sentry_dart_plugin

      - name: Build release APK
        env:
          SENTRY_DSN:           ${{ github.event_name != 'pull_request' && secrets.SENTRY_DSN || '' }}
          FEEDBACK_WORKER_URL:  ${{ vars.FEEDBACK_WORKER_URL || 'https://feedback.alexsiri7.workers.dev/' }}
          FEEDBACK_HMAC_SECRET: ${{ github.event_name != 'pull_request' && secrets.FEEDBACK_HMAC_SECRET || '' }}
        run: flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --split-debug-info=build/symbols --obfuscate --dart-define=SENTRY_DSN=$SENTRY_DSN --dart-define=FEEDBACK_WORKER_URL=$FEEDBACK_WORKER_URL --dart-define=FEEDBACK_HMAC_SECRET=$FEEDBACK_HMAC_SECRET

      - name: Upload debug symbols to Sentry (APK)
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
        if: env.SENTRY_AUTH_TOKEN != ''
        run: flutter pub run sentry_dart_plugin

      - name: Upload signed AAB
        if: steps.keystore.outputs.used_real == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload signed APK
        if: steps.keystore.outputs.used_real == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload CI-signed AAB (not for Play Store)
        if: steps.keystore.outputs.used_real != 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-aab-ci-throwaway
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload CI-signed APK (not reinstallable over real builds)
        if: steps.keystore.outputs.used_real != 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk-ci-throwaway
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Publish to Play Store internal track (non-tag)
        if: steps.keystore.outputs.used_real == 'yes' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.interstellarai.cosmicmatch
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # Cleared the Play Console "no deobfuscation file" warning — see issue #136.
          # Native debug symbols are embedded in the AAB itself via ndk.debugSymbolLevel,
          # so we don't pass `debugSymbols:` here.
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: internal
          status: draft
          releaseName: ${{ env.BUILD_NAME }}

      - name: Publish to Play Store production (tag release)
        if: steps.keystore.outputs.used_real == 'yes' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.interstellarai.cosmicmatch
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # Cleared the Play Console "no deobfuscation file" warning — see issue #136.
          # Native debug symbols are embedded in the AAB itself via ndk.debugSymbolLevel,
          # so we don't pass `debugSymbols:` here.
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          track: production
          status: completed
          releaseName: ${{ env.BUILD_NAME }}

      - name: Create GitHub Release (tag pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Notify prod landing
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.keystore.outputs.used_real == 'yes'
        # Best-effort: the Play Store upload above is the deliverable; a slow or
        # unreachable ntfy.sh must not turn the Release job red (#244).
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          curl -sS -o /dev/null --connect-timeout 5 --max-time 10 \
            -H "Title: cosmic-match landed in prod" \
            -H "Tags: tada" \
            -d "Cosmic Match uploaded to Play Store ✓" \
            "ntfy.sh/$NTFY_TOPIC"

      - name: Clean up signing credentials
        if: always()
        run: rm -f android/cosmic-match-release.jks android/key.properties

  unsafe-change-tests:
    # The unsafe-change check itself runs from the base branch
    # (pull_request_target), so a PR changing it is only tested here.
    name: unsafe-change checker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (system python3 + PyYAML, as the check uses)
        run: python3 -m unittest discover -s .github/unsafe-change

  workflow-tests:
    name: Workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release deploy gate (system python3 + PyYAML)
        run: python3 -m unittest discover -s .github/workflow-tests
